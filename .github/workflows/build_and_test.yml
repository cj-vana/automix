name: Build & Test

on:
  push:
    branches: [main, dev]
    # Without an explicit tag filter a push of refs/tags/v* never starts this
    # workflow, which left the release job below permanently unreachable.
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  BUILD_TYPE: Release

jobs:
  rust-tests:
    name: Rust DSP Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/automix-dsp/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/automix-dsp/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --manifest-path rust/automix-dsp/Cargo.toml --check

      - name: Check version consistency
        run: |
          CARGO_VERSION=$(grep '^version' rust/automix-dsp/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ "$CARGO_VERSION" != "$FILE_VERSION" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VERSION, VERSION=$FILE_VERSION"
            exit 1
          fi

      - name: Run clippy
        run: cargo clippy --manifest-path rust/automix-dsp/Cargo.toml -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/automix-dsp/Cargo.toml --verbose

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-14
    needs: rust-tests
    env:
      # Secrets are absent on pull requests from forks, so signing has to be
      # conditional or every outside contribution fails the build.
      SIGNING_AVAILABLE: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_API_ISSUER_ID != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install tools
        run: |
          brew install ninja
          cargo install cbindgen

      - name: Cache Cargo (build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/automix-dsp/target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('rust/automix-dsp/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: macos-build-${{ hashFiles('CMakeLists.txt', 'rust/**', 'source/**') }}
          restore-keys: macos-build-

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Run C++ tests (Catch2)
        run: ctest --test-dir build --output-on-failure -C ${{ env.BUILD_TYPE }}

      # Signing material lives in a throwaway keychain that is deleted in the
      # cleanup step below, so nothing persists on the runner.
      - name: Import signing certificate
        if: env.IS_TAG == 'true' && env.SIGNING_AVAILABLE == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that can never be
          # answered on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Developer ID Application"

      - name: Sign, notarize, and package
        if: env.IS_TAG == 'true' && env.SIGNING_AVAILABLE == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

          export SIGN_IDENTITY="Developer ID Application: Christopher Vana ($TEAM_ID)"
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"

          ART="build/AutoMix_artefacts/${{ env.BUILD_TYPE }}"
          ./packaging/sign-and-notarize.sh "$ART/AU/AutoMix.component" AutoMix-AU-macOS.zip
          ./packaging/sign-and-notarize.sh "$ART/Standalone/AutoMix.app" AutoMix-Standalone-macOS.zip

          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Unsigned fallback so branch and PR builds still produce something to
      # download and test with.
      - name: Package (unsigned)
        if: env.IS_TAG != 'true' || env.SIGNING_AVAILABLE != 'true'
        run: |
          set -euo pipefail
          ART="build/AutoMix_artefacts/${{ env.BUILD_TYPE }}"
          ditto -c -k --sequesterRsrc --keepParent "$ART/AU/AutoMix.component" AutoMix-AU-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "$ART/Standalone/AutoMix.app" AutoMix-Standalone-macOS.zip

      - name: Clean up keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" && -f "${KEYCHAIN:-}" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" || true

      # Zips, not bundles: upload-artifact does not preserve the executable bit
      # or symlinks, which silently produced an unlaunchable .app in the v0.3.0
      # release. Archiving before upload keeps the bundle intact.
      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMix-AU-macOS
          path: AutoMix-AU-macOS.zip

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMix-Standalone-macOS
          path: AutoMix-Standalone-macOS.zip

  release:
    name: Create Release
    runs-on: macos-14
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # The archives arrive already signed, notarized, and stapled from
      # build-macos, so this job only attaches them.
      - name: Download AU artifact
        uses: actions/download-artifact@v8
        with:
          name: AutoMix-AU-macOS

      - name: Download Standalone artifact
        uses: actions/download-artifact@v8
        with:
          name: AutoMix-Standalone-macOS

      - name: Verify the archives are notarized
        run: |
          set -euo pipefail
          for z in AutoMix-AU-macOS.zip AutoMix-Standalone-macOS.zip; do
            rm -rf verify && mkdir verify
            ditto -x -k "$z" verify
            BUNDLE="$(find verify -maxdepth 1 -mindepth 1 -print -quit)"
            echo "== $z"
            codesign --verify --deep --strict --verbose=2 "$BUNDLE"
            # A stapled ticket is what lets an offline machine open it. If this
            # fails, the release would ship something Gatekeeper still blocks.
            xcrun stapler validate "$BUNDLE"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AutoMix-AU-macOS.zip
            AutoMix-Standalone-macOS.zip
          generate_release_notes: true
          body: |
            Universal binary (arm64 + x86_64), macOS 12 or later.

            ## Install

            - **AU plugin** — unzip and put `AutoMix.component` in
              `~/Library/Audio/Plug-Ins/Components/`, then restart your host.
            - **Standalone** — unzip and move `AutoMix.app` to `/Applications`.

            Signed with a Developer ID certificate, notarized by Apple, and stapled, so
            these open without a Gatekeeper warning and without any `xattr` workaround.
            The ticket is attached to the bundle, so it also works offline.

            To check for yourself:

            ```bash
            codesign --verify --deep --strict --verbose=2 /Applications/AutoMix.app
            xcrun stapler validate /Applications/AutoMix.app
            spctl -a -vvv -t install /Applications/AutoMix.app
            ```

            ---
